<header><a href="/unit-lab-tool.html">← 유닛 랩</a><h1>블록 고양이</h1><span class="tag">BCAT · 02</span><span class="subtitle">수스 · 캐릭터 제작 / 펫 미리보기</span></header>
<main><aside class="reference"><div class="eyebrow">DESIGN REFERENCE</div><h2>정답 시안과 함께 확인</h2><p>앉기 · 서기 · 걷기<br>블록 실루엣과 메카 페인트를 기준으로 제작했습니다.</p><div class="ref-image"><img src="/tools/unit_lab/pets/block_cat/reference.png" id="reference" alt="블록 고양이 정답 시안, 앉기 서기 걷기"></div><div class="swatches"><i style="background:#83c9d8"></i><i style="background:#29b6c4"></i><i style="background:#303f49"></i><i style="background:#80df32"></i><i style="background:#fc3654"></i><i style="background:#9752cc"></i></div><div class="notes">스카이블루 / 시안 · 차콜 베스트 · 라임 포인트<br>붉은 눈 · 퍼플 관절 · 큐브 체인 꼬리<br><br>마우스 드래그로 회전하고 휠로 확대할 수 있습니다.</div></aside>
<section class="viewport"><canvas id="canvas"></canvas><div class="viewport-head"><div class="eyebrow">BLENDER MODEL · LIVE</div><div id="clipLabel">모델 불러오는 중</div></div><div class="view-buttons"><button data-view="face">얼굴 확대</button><button data-view="front">정면</button><button data-view="threequarter" class="active">3/4</button><button data-view="side">측면</button><button data-view="back">후면</button></div><div class="hint">드래그 회전 · 휠 확대</div><div id="error"></div><div class="controls"><div class="clips"><button data-clip="idle_sit" class="active">앉기 대기</button><button data-clip="stand">서기</button><button data-clip="walk">걷기</button><button data-clip="idle_look">두리번</button><button data-clip="attack_laser">눈 레이저</button></div><div class="row"><button id="pause">일시정지</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="동작 시간"><span id="clock">0.00 s</span><label>속도<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label><input id="wire" type="checkbox">메시</label><label><input id="sockets" type="checkbox">눈 기준점</label></div><div id="status">모델과 4개 동작을 준비하고 있습니다.</div></div></section></main><script type="module" src="/src/tools/unitLabPet/main.ts"></script></body></html>
