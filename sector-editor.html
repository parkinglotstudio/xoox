<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XOOX 맵 배치</title>
    <style>
      :root {
        --bg: #12141a; --panel: #1c212b; --line: #3a4454; --text: #e8eef8;
        --muted: #9aa8bc; --accent: #5ec8ff; --ok: #6ddea0; --warn: #ffd27a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      .bar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .bar h1 { margin: 0; font-size: 15px; font-weight: 800; }
      .bar .hint { color: var(--muted); font-size: 12px; }
      .bar button, .bar select {
        border: 1px solid var(--line); background: #11161f; color: var(--text);
        border-radius: 8px; padding: 7px 12px; font-weight: 700; cursor: pointer;
      }
      .bar button.primary { background: #1a4a63; border-color: #2f7ea8; color: #dff4ff; }
      .status { font-size: 12px; color: var(--muted); margin-left: auto; }
      .status.ok { color: var(--ok); } .status.err { color: #ff8f8f; }

      .workspace {
        display: grid;
        grid-template-columns: 1fr var(--side-w, 300px);
        min-height: 0; height: 100%;
        --phone-h: 42%;
        --side-w: 300px;
      }
      .main-col {
        min-width: 0; min-height: 0; height: 100%;
        display: flex; flex-direction: column;
      }
      .map-wrap {
        flex: 1 1 auto;
        min-height: 80px;
        overflow: hidden; padding: 12px; background: #0a0c10;
        display: grid; place-items: center;
        container-type: size;
      }
      .split-y {
        flex: 0 0 8px;
        cursor: row-resize; touch-action: none;
        background: linear-gradient(180deg, #2a3344, #1a2030);
        border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
        position: relative; z-index: 8;
      }
      .split-y::after {
        content: ""; position: absolute; left: 50%; top: 50%;
        width: 36px; height: 3px; margin: -1.5px 0 0 -18px;
        border-radius: 2px; background: #6a7a90;
      }
      .split-y:hover, .split-y.dragging { background: #243044; }
      .split-y:hover::after, .split-y.dragging::after { background: var(--accent); }
      .phone-wrap {
        flex: 0 0 var(--phone-h);
        min-height: 120px;
        background: #0e1218;
        padding: 8px 12px; min-width: 0;
        display: flex; flex-direction: column; gap: 6px;
        overflow: hidden;
      }
      .side {
        border-left: 1px solid var(--line); background: var(--panel);
        padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px;
        min-width: 180px; position: relative;
      }
      .split-x {
        position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
        cursor: col-resize; touch-action: none; z-index: 8;
      }
      .split-x:hover, .split-x.dragging { background: rgba(94, 200, 255, 0.25); }

      .map-stage {
        position: relative;
        width: min(100cqw, 100cqh);
        height: min(100cqw, 100cqh);
        border: 1px solid var(--line);
        aspect-ratio: 1 / 1;
      }
      .map-stage .sector-art-cell {
        position: absolute; z-index: 1; overflow: hidden;
        border: 1px solid rgba(94,200,255,0.35);
      }
      .map-stage img.sector-art {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; pointer-events: none; opacity: 0.92;
      }
      .map-stage .sector-art-cell img.sector-art { opacity: 1; }
      .map-stage .sector-art-cell.is-tiles img.sector-art {
        object-fit: fill;
        opacity: 1;
      }
      .map-stage .sector-art-cell.is-polluted img.sector-art,
      .phone-stage.is-polluted .phone-bg {
        filter: grayscale(1) contrast(1.85) brightness(2.15);
        background-color: #f7f4ef;
      }

      /* 오염 미리보기: after PNG + 포토샵식 스케치/사이버 필터 (에디터 전용) */
      .fx-stack { position: absolute; inset: 0; overflow: hidden; background: #070a10; }
      .fx-stack .fx-layer {
        position: absolute; inset: 0;
        background-repeat: no-repeat;
        background-size: inherit;
        background-position: inherit;
        pointer-events: none;
      }
      .fx-stack img.fx-layer {
        width: 100%; height: 100%; object-fit: cover; display: block;
        background: none;
      }
      .fx-stack .fx-tint,
      .fx-stack .fx-scan,
      .fx-stack .fx-grid,
      .fx-stack .fx-vignette {
        position: absolute; inset: 0; pointer-events: none;
      }
      .fx-stack .fx-chroma {
        position: absolute; inset: 0;
        background-repeat: no-repeat;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0;
      }
      .fx-stack img.fx-chroma {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }

      /* A · 사이버 스케치 — 연필(color-dodge) + 시안 틴트 (첫 스케치) */
      .fx-cyber-sketch .fx-base {
        filter: grayscale(1) contrast(1.4) brightness(0.82);
      }
      .fx-cyber-sketch .fx-edge {
        filter: grayscale(1) invert(1) contrast(1.28) brightness(1.08) blur(1.5px);
        mix-blend-mode: color-dodge;
        opacity: 0.92;
      }
      .fx-cyber-sketch .fx-chroma {
        opacity: 0;
      }
      .fx-cyber-sketch .fx-tint {
        background:
          radial-gradient(ellipse at 40% 30%, rgba(0, 220, 255, 0.16), transparent 55%),
          linear-gradient(160deg, rgba(40, 20, 80, 0.18), rgba(0, 180, 220, 0.1));
        mix-blend-mode: soft-light;
      }
      .fx-cyber-sketch .fx-scan {
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 255, 255, 0.045) 0 1px,
          transparent 1px 3px
        );
        mix-blend-mode: overlay;
        opacity: 0.45;
      }
      .fx-cyber-sketch .fx-grid {
        background-image:
          linear-gradient(rgba(0, 255, 220, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 220, 0.035) 1px, transparent 1px);
        background-size: 36px 36px;
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      .fx-cyber-sketch .fx-vignette {
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
      }

      /* B · 홀로그램 청사진 — 어두운 네이비 지형 + 시안 도면선 */
      .fx-blueprint .fx-base {
        filter: grayscale(1) contrast(1.2) brightness(0.34) sepia(0.45) hue-rotate(190deg) saturate(2);
      }
      .fx-blueprint .fx-edge {
        filter:
          grayscale(1) invert(1) brightness(1.7) contrast(14) blur(0.55px)
          sepia(1) hue-rotate(175deg) saturate(12);
        mix-blend-mode: screen;
        opacity: 0.5;
      }
      .fx-blueprint .fx-chroma {
        filter:
          grayscale(1) invert(1) brightness(1.5) contrast(12) blur(1px)
          sepia(1) hue-rotate(200deg) saturate(10);
        mix-blend-mode: screen;
        opacity: 0.2;
        transform: translate(-1px, 1px);
      }
      .fx-blueprint .fx-tint {
        background:
          linear-gradient(180deg, rgba(0, 30, 70, 0.4), rgba(0, 5, 25, 0.65));
        mix-blend-mode: multiply;
      }
      .fx-blueprint .fx-scan {
        background: repeating-linear-gradient(
          0deg,
          rgba(80, 200, 255, 0.07) 0 1px,
          transparent 1px 4px
        );
        opacity: 0.5;
      }
      .fx-blueprint .fx-grid {
        background-image:
          linear-gradient(rgba(80, 200, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(80, 200, 255, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.35;
        mix-blend-mode: screen;
      }
      .fx-blueprint .fx-vignette {
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 5, 20, 0.82) 100%);
      }

      /* C · 글리치 네온 — 어두운 지형 + 시안/마젠타 채널 어긋남 */
      .fx-neon-ghost .fx-base {
        filter: grayscale(1) contrast(1.5) brightness(0.42);
      }
      .fx-neon-ghost .fx-edge {
        filter:
          grayscale(1) invert(1) brightness(2.1) contrast(26) blur(0.32px)
          sepia(1) hue-rotate(150deg) saturate(18);
        mix-blend-mode: screen;
        opacity: 0.72;
        transform: translate(-1px, 0);
      }
      .fx-neon-ghost .fx-chroma {
        filter:
          grayscale(1) invert(1) brightness(2.0) contrast(24) blur(0.35px)
          sepia(1) hue-rotate(300deg) saturate(18);
        mix-blend-mode: screen;
        opacity: 0.48;
        transform: translate(2px, 0);
      }
      .fx-neon-ghost .fx-tint {
        background:
          linear-gradient(115deg, rgba(255, 0, 200, 0.12), transparent 42%),
          linear-gradient(295deg, rgba(0, 255, 230, 0.1), transparent 48%),
          rgba(0, 0, 0, 0.25);
        mix-blend-mode: soft-light;
      }
      .fx-neon-ghost .fx-scan {
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 0, 220, 0.08) 0 1px,
          transparent 1px 3px
        );
        opacity: 0.55;
      }
      .fx-neon-ghost .fx-grid {
        background-image:
          linear-gradient(rgba(255, 0, 200, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 230, 0.05) 1px, transparent 1px);
        background-size: 18px 18px;
        opacity: 0.4;
        mix-blend-mode: screen;
      }
      .fx-neon-ghost .fx-vignette {
        background: radial-gradient(ellipse at center, transparent 32%, rgba(0, 0, 0, 0.8) 100%);
      }

      /* D · CRT 단말 — 어두운 지형 + 초록 HUD 선 */
      .fx-ink-wire .fx-base {
        filter: grayscale(1) contrast(1.3) brightness(0.32) sepia(0.2) hue-rotate(70deg) saturate(1.2);
      }
      .fx-ink-wire .fx-edge {
        filter:
          grayscale(1) invert(1) brightness(1.85) contrast(18) blur(0.4px)
          sepia(1) hue-rotate(85deg) saturate(14) brightness(1.1);
        mix-blend-mode: screen;
        opacity: 0.58;
      }
      .fx-ink-wire .fx-chroma {
        filter:
          grayscale(1) invert(1) brightness(1.6) contrast(14) blur(0.9px)
          sepia(1) hue-rotate(160deg) saturate(10);
        mix-blend-mode: screen;
        opacity: 0.22;
      }
      .fx-ink-wire .fx-tint {
        background: linear-gradient(180deg, rgba(0, 25, 12, 0.35), rgba(0, 5, 15, 0.6));
        mix-blend-mode: multiply;
      }
      .fx-ink-wire .fx-scan {
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 255, 160, 0.1) 0 1px,
          transparent 1px 2px
        );
        opacity: 0.7;
        mix-blend-mode: overlay;
      }
      .fx-ink-wire .fx-grid {
        background-image:
          linear-gradient(rgba(0, 255, 180, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 180, 0.06) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: 0.35;
        mix-blend-mode: screen;
      }
      .fx-ink-wire .fx-vignette {
        background: radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, 0.82) 100%);
      }

      .phone-bg-host { position: absolute; inset: 0; z-index: 0; }
      .phone-stage.is-tiles .phone-bg-host { background: #070b10; }
      .map-stage.is-tiles .map-bg { opacity: 0.22; filter: grayscale(1) brightness(0.75); }
      .phone-bg-host .fx-stack { position: absolute; inset: 0; z-index: 1; }
      .map-stage img.map-bg {
        display: block; width: 100%; height: 100%; object-fit: fill;
        user-select: none; pointer-events: none;
      }
      .map-overlay { position: absolute; inset: 0; }
      .path-layer {
        position: absolute; inset: 0; z-index: 3;
        width: 100%; height: 100%;
        pointer-events: none;
      }
      .path-layer .npc-path {
        fill: none; stroke: #ffd27a; stroke-width: 0.45;
        stroke-dasharray: 1.2 0.8; opacity: 0.85;
      }
      .path-layer .quest-zone {
        fill: rgba(125, 255, 154, 0.08);
        stroke: #7dff9a; stroke-width: 0.35; opacity: 0.9;
      }
      .path-layer .sector-link {
        fill: none; stroke: #5ec8ff; stroke-width: 0.55; opacity: 0.7;
        marker-end: url(#pathArrow);
      }
      .sector-grid {
        position: absolute; inset: 0; display: grid;
        grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
        pointer-events: none; z-index: 1;
      }
      .sector-grid div { border: 1px solid rgba(255,255,255,0.15); }

      .viewport-frame {
        position: absolute; z-index: 6;
        border: 2px solid #7dff9a; background: rgba(125, 255, 154, 0.14);
        cursor: grab; touch-action: none;
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.28);
      }
      .viewport-frame span {
        position: absolute; left: 3px; top: 1px; font-size: 10px; font-weight: 800;
        color: #c8ffd4; text-shadow: 0 1px 2px #000; white-space: nowrap; pointer-events: none;
      }

      /* 섬 위: 아이콘만 */
      .node-icon {
        position: absolute; z-index: 4;
        width: 22px; height: 22px; margin-left: -11px; margin-top: -11px;
        border: 1.5px solid rgba(255, 210, 122, 0.9); border-radius: 50%;
        background: rgba(18, 14, 24, 0.92); color: #fff;
        font-size: 12px; line-height: 19px; text-align: center;
        cursor: pointer; touch-action: none; padding: 0;
      }
      .node-icon.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(94, 200, 255, 0.55);
        z-index: 5;
      }

      .phone-head {
        display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      }
      .phone-head h2 { margin: 0; font-size: 13px; font-weight: 800; }
      .phone-head .sub { font-size: 12px; color: var(--muted); }

      .phone-stage {
        position: relative; flex: 1; min-height: 0;
        width: 100%; max-width: 100%; margin: 0 auto;
        /* 가용 높이에 맞춰 가로도 따라감 (16:9 유지) */
        aspect-ratio: 16 / 9;
        height: auto;
        max-height: 100%;
        border: 2px solid #5a8f6a; border-radius: 10px; overflow: hidden;
        background: #000;
      }
      .phone-stage-host {
        flex: 1; min-height: 0; display: grid; place-items: center;
        container-type: size; overflow: hidden;
      }
      .phone-stage-host .phone-stage {
        width: min(100cqw, calc(100cqh * 16 / 9));
        height: min(100cqh, calc(100cqw * 9 / 16));
        aspect-ratio: auto;
        max-height: none;
      }
      .phone-stage .phone-bg {
        position: absolute; inset: 0;
        background-repeat: no-repeat;
        /* 섬 전체를 깔고 background-position/size로 뷰포트 크롭 */
        background-size: 1000% 1000%; /* JS가 덮어씀 */
        pointer-events: none;
      }
      .phone-stage .phone-nodes { position: absolute; inset: 0; z-index: 3; }
      .phone-zone {
        position: absolute; z-index: 1;
        transform: translate(-50%, -50%);
        border: 1.5px dashed rgba(125, 255, 154, 0.9);
        border-radius: 50%;
        background: rgba(125, 255, 154, 0.1);
        pointer-events: none;
        color: #c8ffd4; font-size: 10px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        text-shadow: 0 1px 2px #000;
      }
      .phone-zone span { opacity: 0.9; max-width: 90%; text-align: center; }
      .phone-node {
        position: absolute; z-index: 2;
        transform: translate(-50%, -50%);
        min-width: 52px; padding: 5px 7px;
        border: 2px solid #ffd27a; border-radius: 10px;
        background: rgba(20, 16, 28, 0.94); color: #ffe6b0;
        font-size: 11px; font-weight: 800; line-height: 1.15;
        cursor: grab; touch-action: none; text-align: center;
      }
      .phone-node.selected { border-color: var(--accent); }
      .phone-node .ico { display: block; font-size: 16px; }
      .phone-char {
        position: absolute; left: 50%; top: 88%; transform: translate(-50%, -80%);
        background: linear-gradient(180deg, #ffc878, #e89540);
        border: 2px solid #fff; border-radius: 46% 46% 40% 40%;
        aspect-ratio: 0.55 / 1; pointer-events: none; z-index: 5;
        box-shadow: 0 3px 0 rgba(0,0,0,0.45);
      }

      /* 캐릭터 주변 시야 연출 (에디터 미리보기 · filter 모드) */
      .phone-vision {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        display: none;
      }
      .phone-stage.has-vision .phone-vision { display: block; }
      .phone-vision-dim {
        position: absolute; inset: 0;
        background: rgba(0, 2, 8, 0.72);
        -webkit-mask-image: radial-gradient(
          circle 22% at 50% 78%,
          transparent 0%,
          transparent 42%,
          rgba(0,0,0,0.55) 68%,
          #000 100%
        );
        mask-image: radial-gradient(
          circle 22% at 50% 78%,
          transparent 0%,
          transparent 42%,
          rgba(0,0,0,0.55) 68%,
          #000 100%
        );
      }
      .phone-vision-boost {
        position: absolute; inset: 0;
        background:
          radial-gradient(
            circle 20% at 50% 78%,
            rgba(0, 255, 230, 0.16) 0%,
            rgba(0, 200, 255, 0.06) 45%,
            transparent 70%
          );
        mix-blend-mode: screen;
      }
      .phone-vision-ring {
        position: absolute;
        left: 50%; top: 78%;
        width: 26%; aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1.5px solid rgba(0, 255, 230, 0.55);
        box-shadow:
          0 0 12px rgba(0, 255, 230, 0.45),
          0 0 28px rgba(0, 180, 255, 0.25),
          inset 0 0 18px rgba(0, 255, 220, 0.12);
        animation: visionPulse 2.4s ease-in-out infinite;
      }
      .phone-vision-ring::before {
        content: "";
        position: absolute; inset: -6px;
        border-radius: 50%;
        border: 1px dashed rgba(0, 255, 200, 0.28);
        animation: visionSpin 12s linear infinite;
      }
      .phone-vision-core {
        position: absolute;
        left: 50%; top: 78%;
        width: 8%; aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 220, 0.55), rgba(0, 255, 230, 0.15) 55%, transparent 70%);
        box-shadow: 0 0 16px rgba(0, 255, 230, 0.5);
      }
      @keyframes visionPulse {
        0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      }
      @keyframes visionSpin {
        to { transform: rotate(360deg); }
      }
      .phone-stage.has-vision .phone-char {
        box-shadow:
          0 3px 0 rgba(0,0,0,0.45),
          0 0 14px rgba(0, 255, 230, 0.55),
          0 0 28px rgba(0, 180, 255, 0.3);
        filter: drop-shadow(0 0 4px rgba(0, 255, 230, 0.65));
      }
      /* filter 모드: 시야 안 맵을 한 번 더 또렷하게 */
      .phone-stage.has-vision .phone-bg-host .fx-stack {
        -webkit-mask-image: radial-gradient(
          circle 24% at 50% 78%,
          #000 0%,
          #000 48%,
          rgba(0,0,0,0.55) 72%,
          rgba(0,0,0,0.22) 100%
        );
        mask-image: radial-gradient(
          circle 24% at 50% 78%,
          #000 0%,
          #000 48%,
          rgba(0,0,0,0.55) 72%,
          rgba(0,0,0,0.22) 100%
        );
      }
      .phone-stage.has-vision .phone-bg-host::before {
        content: "";
        position: absolute; inset: 0; z-index: 0;
        background: #05080e;
        pointer-events: none;
      }

      .side h2 { margin: 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .list { display: flex; flex-direction: column; gap: 4px; max-height: 36vh; overflow: auto; }
      .list button {
        text-align: left; border: 1px solid var(--line); background: #11161f; color: var(--text);
        border-radius: 8px; padding: 6px 8px; cursor: pointer; font-weight: 700; font-size: 12px;
      }
      .list button.on { border-color: var(--accent); background: #152433; }
      .list button span { display: block; color: var(--muted); font-size: 10px; font-weight: 600; }
      .field { display: grid; gap: 4px; }
      .field label { font-size: 11px; color: var(--muted); }
      .field input, .field select {
        border: 1px solid var(--line); background: #11161f; color: var(--text);
        border-radius: 8px; padding: 7px 8px;
      }
      .info-card, .scale-box, .help {
        font-size: 12px; line-height: 1.45; background: #11161f; border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 10px; color: var(--muted);
      }
      .info-card strong { color: var(--text); }
      .info-card .big { font-size: 22px; margin-right: 6px; }
      code { color: var(--warn); }
      .size-row input[type="range"] { width: 100%; }
      .size-row .val { font-size: 12px; color: var(--warn); font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>맵 배치</h1>
      <span class="hint">NPC만 · 데코 아트는 별도</span>
      <label class="hint"><input type="checkbox" id="showPath" checked /> 동선</label>
      <label class="hint" for="artMode">보기</label>
      <select id="artMode" title="원본 컨셉 · 정화전 · 정화후">
        <option value="polluted" selected>정화전 (타일+하얗게)</option>
        <option value="purified">정화후 (타일)</option>
        <option value="concept">원본 (컨셉)</option>
      </select>
      <button type="button" id="btnReload">다시 불러오기</button>
      <button type="button" class="primary" id="btnSave">CSV 저장</button>
      <span class="status" id="status">ready</span>
    </div>
    <div class="workspace" id="workspace">
      <div class="main-col" id="mainCol">
        <div class="map-wrap">
          <div class="map-stage" id="mapStage">
            <img class="map-bg" id="mapBg" alt="island" />
            <div class="sector-grid" aria-hidden="true">
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
              <div></div><div></div><div></div>
            </div>
            <div class="map-overlay" id="mapOverlay"></div>
          </div>
        </div>

        <div class="split-y" id="splitY" title="위·아래 크기 조절" role="separator" aria-orientation="horizontal"></div>

        <div class="phone-wrap" id="phoneWrap">
          <div class="phone-head">
            <h2>미리보기 (NPC 배치)</h2>
            <span class="sub" id="phoneSub">초록 박스가 비추는 구역 · 여기서 NPC 드래그</span>
          </div>
          <div class="phone-stage-host">
            <div class="phone-stage" id="phoneStage">
              <div class="phone-bg-host" id="phoneBgHost">
                <div class="phone-bg" id="phoneBg"></div>
              </div>
              <div class="phone-vision" id="phoneVision" aria-hidden="true">
                <div class="phone-vision-dim"></div>
                <div class="phone-vision-boost"></div>
                <div class="phone-vision-ring"></div>
                <div class="phone-vision-core"></div>
              </div>
              <div class="phone-char" id="phoneChar"></div>
              <div class="phone-nodes" id="phoneNodes"></div>
            </div>
          </div>
        </div>
      </div>

      <aside class="side" id="sidePanel">
        <div class="split-x" id="splitX" title="사이드 폭 조절" role="separator" aria-orientation="vertical"></div>
        <h2>선택 정보</h2>
        <div class="info-card" id="infoCard">섬 위 아이콘을 클릭하세요.</div>
        <h2>스케일</h2>
        <div class="scale-box" id="scaleBox">…</div>
        <div class="size-row">
          <label style="font-size:11px;color:var(--muted)">화면 안 캐릭 높이</label>
          <input type="range" id="sizeSlider" min="8" max="96" step="1" value="36" />
          <div class="val" id="sizeVal">36px</div>
        </div>
        <h2>노드 (<span id="nodeCount">0</span>)</h2>
        <div class="list" id="nodeList"></div>
        <h2>좌표</h2>
        <div class="field"><label>npc_id</label><input id="fId" readonly /></div>
        <div class="field"><label>area_id</label><select id="fArea"></select></div>
        <div class="field"><label>x_pct</label><input id="fX" type="number" step="0.1" min="0" max="100" /></div>
        <div class="field"><label>y_pct</label><input id="fY" type="number" step="0.1" min="0" max="100" /></div>
        <div class="help">
          배치는 <b>NPC만</b> (<code>area_npc_config.csv</code>). 데코는 아트 작업 중.<br/>
          동선: 섹터 안 NPC를 남→북으로 잇고, 섹터 연결은 파란 화살.<br/>
          위: 섬 전체 · 아래: 모바일 미리보기에서 드래그<br/>
          보기: 원본 컨셉 · 정화전 · 정화후
        </div>
      </aside>
    </div>
    <script type="module" src="/src/sectorEditor.ts"></script>
  </body>
</html>
