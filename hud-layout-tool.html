<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XOOX HUD 배치 툴 · 필러 + 위젯</title>
    <style>
      :root {
        --bg: #12141a; --panel: #1c212b; --line: #3a4454; --text: #e8eef8;
        --muted: #9aa8bc; --accent: #5ec8ff; --ok: #6ddea0; --warn: #ffd27a; --bad: #ff8f8f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }

      .bar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .bar h1 { margin: 0; font-size: 15px; font-weight: 800; }
      .bar .hint { color: var(--muted); font-size: 12px; }
      .bar button, .bar select, .bar label.tog {
        border: 1px solid var(--line); background: #11161f; color: var(--text);
        border-radius: 8px; padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 13px;
      }
      .bar button.primary { background: #1a4a63; border-color: #2f7ea8; color: #dff4ff; }
      .bar label.tog { display: inline-flex; align-items: center; gap: 6px; }
      .status { font-size: 12px; color: var(--muted); margin-left: auto; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--bad); }

      .workspace { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
      .stage-col {
        min-width: 0; min-height: 0; display: grid; place-items: center;
        padding: 16px; background:
          radial-gradient(circle at 20% 10%, #1a2433 0%, transparent 45%), #0c0e13;
      }
      .stage {
        position: relative;
        width: min(100%, calc((100vh - 88px) * 16 / 9));
        max-height: calc(100vh - 88px);
        aspect-ratio: 16 / 9;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #05080d;
        box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        touch-action: none;
        user-select: none;
      }
      .stage-world {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse at 40% 70%, #163024 0%, transparent 50%),
          linear-gradient(180deg, #0a1218 0%, #081018 40%, #05080d 100%);
        pointer-events: none;
      }
      .stage-world::after {
        content: "3D VIEW";
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        font-size: 42px; font-weight: 900; letter-spacing: 0.18em; color: rgba(45, 224, 208, 0.08);
      }
      .stage-grid {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
        background-image:
          linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
        background-size: 10% 10%;
      }
      .hud-p, .hud-w { position: absolute; }
      .hud-p {
        border: 1.5px dashed rgba(94, 200, 255, 0.45);
        background: rgba(45, 140, 200, 0.08);
        pointer-events: auto;
        cursor: pointer;
      }
      .hud-p.off { opacity: 0.22; }
      .hud-p .p-tag {
        position: absolute; left: 4px; top: 4px; z-index: 2;
        font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
        color: #9ed8ff; background: rgba(8,12,18,0.72); padding: 1px 6px; border-radius: 4px;
        pointer-events: none;
      }
      .hud-p.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

      .hud-w {
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 8px;
        overflow: hidden;
        cursor: grab;
        display: flex; flex-direction: column;
      }
      .hud-w.off { opacity: 0.28; filter: grayscale(0.6); }
      .hud-w.sel { outline: 2px solid var(--accent); z-index: 40 !important; }
      .hud-w.clash { outline: 2px solid var(--bad); }
      .hud-w .w-head {
        flex: 0 0 auto; padding: 3px 7px; font-size: 10px; font-weight: 800;
        background: rgba(0,0,0,0.35); color: #e8f7f5; letter-spacing: 0.03em;
      }
      .hud-w .w-body { flex: 1; padding: 6px 8px; font-size: 11px; color: #c8e8e4; line-height: 1.35; }
      .hud-w .w-body b { color: #fff; }
      .hud-w.compact {
        border-radius: 999px;
        align-items: center;
        justify-content: center;
      }
      .hud-w .w-body.compact {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1px; width: 100%; height: 100%; padding: 4px 8px; text-align: center; font-weight: 800;
      }
      .hud-w .w-body.compact small { font-size: 9px; color: #9ed8d0; font-weight: 700; }
      .hud-w .w-body.compact b { font-size: 12px; }
      .hud-w.mock-map .w-body {
        background:
          radial-gradient(circle at 40% 55%, rgba(80,200,160,0.35), transparent 40%),
          repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,0.04) 7px 8px);
      }

      .handle {
        position: absolute; width: 9px; height: 9px; background: #dff4ff;
        border: 1px solid #1a4a63; border-radius: 1px; z-index: 5;
      }
      .handle.n { top: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
      .handle.s { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
      .handle.e { right: -5px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
      .handle.w { left: -5px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
      .handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
      .handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
      .handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
      .handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }

      .side {
        border-left: 1px solid var(--line); background: var(--panel);
        padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 12px;
      }
      .side h2 {
        margin: 0; font-size: 11px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.08em;
      }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .list { display: flex; flex-direction: column; gap: 4px; }
      .list .item {
        display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center;
        border: 1px solid var(--line); background: #11161f; border-radius: 8px;
        padding: 6px 8px; cursor: pointer; font-size: 12px;
      }
      .list .item.on { border-color: var(--accent); background: #152433; }
      .list .item span { color: var(--muted); font-size: 10px; display: block; }
      .field { display: grid; gap: 3px; font-size: 12px; }
      .field label { color: var(--muted); }
      .field input, .field select {
        border: 1px solid var(--line); background: #11161f; color: var(--text);
        border-radius: 8px; padding: 7px 8px; font-weight: 700;
      }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .help { font-size: 11px; line-height: 1.45; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
      code { color: var(--warn); }
      .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>HUD 배치</h1>
      <span class="hint">필러(공간) → 위젯 넣기 · 리사이즈 · 노출 체크 · 겹침</span>
      <button type="button" id="btnPillar">+ 필러</button>
      <button type="button" id="btnGrid">그리드</button>
      <label class="tog"><input type="checkbox" id="chkSnap" checked /> 스냅</label>
      <button type="button" id="btnUndo">실행취소</button>
      <button type="button" id="btnReset">기본값</button>
      <button type="button" id="btnReload">다시 불러오기</button>
      <button type="button" class="primary" id="btnSave">저장</button>
      <span class="status" id="status">ready</span>
    </div>
    <div class="workspace">
      <div class="stage-col">
        <div class="stage" id="stage">
          <div class="stage-world"></div>
          <div class="stage-grid" id="stageGrid"></div>
          <div id="layerPillars"></div>
          <div id="layerWidgets"></div>
        </div>
      </div>
      <aside class="side">
        <h2>필러 · 공간</h2>
        <div class="list" id="pillarList"></div>
        <h2>위젯 · UI</h2>
        <div class="list" id="widgetList"></div>
        <h2>선택</h2>
        <div id="inspector"></div>
        <div class="help">
          필러는 <b>빈 칸</b>이다. 위젯을 그 칸에 넣으면 크기가 칸을 따른다.<br />
          흐름 <code>overlay</code>면 칸 안에서 따로 크기·위치를 조절하고 겹칠 수 있다.<br />
          드래그로 이동, 모서리로 리사이즈. 화살표 키로 미세 이동.<br />
          저장 → <code>data/ui/layout/journey_hud_layout.json</code> · 본편 여정에 바로 반영.
        </div>
      </aside>
    </div>
    <script type="module" src="/src/tools/hudLayoutTool/main.ts"></script>
  </body>
</html>
