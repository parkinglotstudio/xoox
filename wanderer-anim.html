<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>방랑자 스프라이트</title>
    <style>
      :root {
        --bg: #14141f; --panel: #1c1814; --line: rgba(201, 137, 58, 0.45);
        --text: #f3ebe0; --muted: #9a8c78; --accent: #e0a04a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      .bar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .bar h1 { margin: 0; font-size: 15px; font-weight: 800; }
      .bar .hint { color: var(--muted); font-size: 12px; }
      .bar a { color: var(--accent); font-weight: 800; text-decoration: none; font-size: 12px; }
      .bar button, .bar select {
        border: 1px solid var(--line); background: #111; color: var(--text);
        border-radius: 999px; padding: 7px 12px; font-weight: 700; cursor: pointer;
      }
      .bar button.on { background: #3a2a14; color: #ffd27a; }
      .bar button.v2 { border-color: rgba(160, 200, 90, 0.55); }
      .bar button.v2.on { background: #243018; color: #d4f0a8; }
      .workspace { display: grid; place-items: center; padding: 24px; }
      .stage {
        width: min(72vw, 512px);
        background:
          linear-gradient(45deg, #3a3a48 25%, transparent 25%),
          linear-gradient(-45deg, #3a3a48 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #3a3a48 75%),
          linear-gradient(-45deg, transparent 75%, #3a3a48 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-color: #2a2a36;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .stage canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }
      .status { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="/tools.html">← 툴 허브</a>
      <h1>방랑자 스프라이트</h1>
      <span class="hint">숫자 2 = 새 클립</span>
      <button type="button" data-anim="ingame_idle" data-bank="game" class="on">대기</button>
      <button type="button" data-anim="move" data-bank="game">뛰기</button>
      <button type="button" data-anim="throw" data-bank="game">던지기</button>
      <button type="button" data-anim="aim_fire" data-bank="game">총쏘기</button>
      <button type="button" data-anim="aim_walk_f" data-bank="game">총앞걷기</button>
      <button type="button" data-anim="aim_walk_b" data-bank="game">총뒤걷기</button>
      <button type="button" data-anim="aim_walk_l" data-bank="game">총좌걷기</button>
      <button type="button" data-anim="aim_walk_r" data-bank="game">총우걷기</button>
      <button type="button" data-anim="walk_l" data-bank="game">좌걷기</button>
      <button type="button" data-anim="walk_r" data-bank="game">우걷기</button>
      <button type="button" data-anim="move_back" data-bank="game">뒤걷기</button>
      <button type="button" data-anim="draw_holster" data-bank="game">빼기</button>
      <button type="button" data-anim="holster" data-bank="game">넣기</button>
      <button type="button" class="v2" data-anim="idle" data-bank="test">아이들2</button>
      <button type="button" class="v2" data-anim="shoot" data-bank="test">총쏘기2</button>
      <button type="button" class="v2" data-anim="run" data-bank="test">달리기2</button>
      <button type="button" class="v2" data-anim="pickup" data-bank="test">줍기2</button>
      <button type="button" class="v2" data-anim="throw" data-bank="test">던지기2</button>
      <button type="button" class="v2" data-anim="victory" data-bank="test">승리2</button>
      <button type="button" class="v2" data-anim="fail" data-bank="test">패배2</button>
      <button type="button" id="play">일시정지</button>
      <button type="button" id="foot" class="on">발기준</button>
      <span class="status" id="status">불러오는 중…</span>
    </header>
    <div class="workspace">
      <div class="stage" id="stage"><canvas id="cv" width="512" height="512"></canvas></div>
    </div>
    <script type="module">
      const GAME_ROOT = "/ui/actor/wanderer";
      const TEST_ROOT = "/ui/wanderer/test_clips";
      const cv = document.getElementById("cv");
      const ctx = cv.getContext("2d");
      const status = document.getElementById("status");
      const playBtn = document.getElementById("play");
      const footBtn = document.getElementById("foot");
      const stage = document.getElementById("stage");

      let bank = "game";
      let animId = "ingame_idle";
      let manifest = null;
      let sheet = null;
      let idx = 0;
      let playing = true;
      let showFoot = true;
      let acc = 0;
      let last = performance.now();

      function cellSize(m) {
        const w = m?.cell_w || m?.cell || 512;
        const h = m?.cell_h || m?.cell || 512;
        return { w, h };
      }

      function footOf(m, w, h) {
        const f = m?.foot_anchor;
        if (f && Number.isFinite(Number(f.x)) && Number.isFinite(Number(f.y))) {
          return { x: Number(f.x), y: Number(f.y) };
        }
        return { x: Math.floor(w / 2), y: h };
      }

      function syncStage(m) {
        const { w, h } = cellSize(m);
        cv.width = w;
        cv.height = h;
        stage.style.width = `min(72vw, ${w}px)`;
        stage.style.aspectRatio = `${w} / ${h}`;
      }

      async function readJson(url) {
        const res = await fetch(url);
        const text = await res.text();
        if (!res.ok || text.trimStart().startsWith("<")) throw new Error(`${url} ${res.status}`);
        return JSON.parse(text);
      }

      async function load(id, nextBank) {
        bank = nextBank || "game";
        animId = id;
        status.textContent = `${id} 불러오는 중…`;
        const root = bank === "test" ? `${TEST_ROOT}/${id}` : `${GAME_ROOT}/${id}`;
        const m = await readJson(`${root}/${id}.json?v=${Date.now()}`);
        const img = new Image();
        img.src = `${root}/${m.sheet}?v=${Date.now()}`;
        await img.decode();
        manifest = m;
        sheet = img;
        idx = 0;
        acc = 0;
        syncStage(m);
        const { w, h } = cellSize(m);
        const foot = footOf(m, w, h);
        const loopNote = m.loop === false ? "원샷" : "루프";
        status.textContent = `${id} · ${m.frame_count}프레임 · ${loopNote} · 셀 ${w}×${h} · 발 (${foot.x}, ${foot.y})`;
      }

      function draw() {
        if (!manifest || !sheet) return;
        const { w, h } = cellSize(manifest);
        const cols = manifest.cols || 1;
        const i = manifest.frames[idx]?.index ?? idx;
        const sx = (i % cols) * w;
        const sy = Math.floor(i / cols) * h;
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.drawImage(sheet, sx, sy, w, h, 0, 0, w, h);
        if (!showFoot) return;
        const foot = footOf(manifest, w, h);
        ctx.save();
        ctx.strokeStyle = "rgba(255, 72, 72, 0.92)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, foot.y + 0.5);
        ctx.lineTo(w, foot.y + 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(foot.x - 18, foot.y);
        ctx.lineTo(foot.x + 18, foot.y);
        ctx.moveTo(foot.x, foot.y - 18);
        ctx.lineTo(foot.x, foot.y + 18);
        ctx.stroke();
        ctx.restore();
      }

      function loop(now) {
        const dt = now - last;
        last = now;
        if (playing && manifest?.frames?.length) {
          acc += dt;
          const hold = manifest.frames[idx]?.duration_ms ?? 120;
          if (acc >= hold) {
            acc = 0;
            if (idx + 1 < manifest.frames.length) idx += 1;
            else if (manifest.loop !== false) idx = 0;
          }
        }
        draw();
        requestAnimationFrame(loop);
      }

      document.querySelectorAll("button[data-anim]").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("button[data-anim]").forEach((x) => x.classList.toggle("on", x === b));
          void load(b.dataset.anim, b.dataset.bank).catch((e) => {
            status.textContent = `실패: ${e}`;
          });
        });
      });
      playBtn.addEventListener("click", () => {
        playing = !playing;
        playBtn.textContent = playing ? "일시정지" : "재생";
      });
      footBtn.addEventListener("click", () => {
        showFoot = !showFoot;
        footBtn.classList.toggle("on", showFoot);
      });

      void load("ingame_idle", "game")
        .then(() => requestAnimationFrame(loop))
        .catch((e) => {
          status.textContent = `실패: ${e}`;
          requestAnimationFrame(loop);
        });
    </script>
  </body>
</html>
